name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# A push that lands while a release is running would race it for the same
# version. Queue instead, and let the second one compute its version after the
# first has tagged.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Any commit releases. Put [skip release] in the message to opt out — for a
    # change that alters nothing anyone installs.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from the last tag, so the tags have to be here.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The version lives in the tags rather than in a committed file. A file
      # would mean the release job pushing a bump back to main, which triggers
      # itself — and every guard against that is a thing to get wrong later.
      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=$(node -p "require('./package.json').version")
            echo "no tags yet; starting at $next from package.json"
          else
            next=$(node -e '
              const [major, minor, patch] = process.argv[1].replace(/^v/, "").split(".").map(Number)
              if ([major, minor, patch].some((n) => !Number.isInteger(n))) {
                console.error(`cannot read a version out of ${process.argv[1]}`)
                process.exit(1)
              }
              console.log(`${major}.${minor}.${patch + 1}`)
            ' "$latest")
            echo "last release $latest; next $next"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: npm run build

      # Unlisted: signed by AMO so Firefox will install it, but never listed
      # there — no public page, not searchable, not installable from AMO.
      - name: Sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx web-ext sign --source-dir dist/firefox --channel unlisted

      # web-ext names the file from the manifest; the update manifest points at
      # an exact URL, so give it a name this workflow decides.
      - name: Name the artifact
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          signed=$(find web-ext-artifacts -name '*.xpi' -print -quit)
          if [ -z "$signed" ]; then
            echo "no signed .xpi was produced" >&2
            exit 1
          fi
          asset="web-ext-artifacts/workhorse-pro-${VERSION}.xpi"
          mv "$signed" "$asset"
          echo "path=$asset" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$asset")" >> "$GITHUB_OUTPUT"

      # Tagged only once signing has succeeded. A tag for a version AMO refused
      # would make the next run skip past a version that was never released.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ASSET" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Build the update manifest
        env:
          VERSION: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET_NAME: ${{ steps.artifact.outputs.name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          url="${SERVER}/${REPO}/releases/download/${TAG}/${ASSET_NAME}"
          node scripts/updates-json.mjs "$VERSION" "$url" site/updates.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deploy
